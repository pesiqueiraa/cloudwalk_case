x-app: &app
  build: .
  image: helpdesk-app
  environment:
    DATABASE_URL: postgresql://helpdesk:helpdesk@postgres:5432/helpdesk
    TEST_DATABASE_URL: postgresql://helpdesk:helpdesk@postgres:5432/helpdesk_test
    KAFKA_BOOTSTRAP: redpanda:9092
    BROKER_URL: http://broker:8001
    PLATFORM_URL: http://platform-web:8000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "55432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create helpdesk.inbound helpdesk.outbound -p 3 -X brokers=redpanda:9092 || true;
        rpk topic describe helpdesk.inbound helpdesk.outbound -X brokers=redpanda:9092 > /dev/null
    restart: "no"

  platform-web:
    <<: *app
    command: ["uvicorn", "helpdesk.platform.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  platform-worker:
    <<: *app
    command: ["python", "-m", "helpdesk.platform.worker"]
    restart: on-failure
    depends_on:
      platform-web:
        condition: service_healthy

  broker:
    <<: *app
    command: ["uvicorn", "helpdesk.broker.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: on-failure
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker-outbound:
    <<: *app
    command: ["python", "-m", "helpdesk.broker.outbound"]
    restart: on-failure
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  agent-mock:
    <<: *app
    command: ["python", "-m", "helpdesk.agent_mock.main"]
    restart: on-failure
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  simulator:
    <<: *app
    profiles: [tools]
    entrypoint: ["python", "-m", "helpdesk.simulator.main"]
    depends_on:
      platform-web:
        condition: service_healthy

  tests:
    <<: *app
    profiles: [test]
    command: ["pytest", "-q"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
