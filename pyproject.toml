[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.14.4",  # 2.12+ exigido pelo typesafe-sdk (25/11)
    "pydantic-settings==2.5.2",
    "psycopg[binary,pool]==3.2.3",
    "aiokafka==0.11.0",
    "cramjam==2.13.0",  # snappy, lz4 e zstd do aiokafka: registro comprimido por produtor de fora não trava o consumidor
    "httpx==0.27.2",
    "typesafe-sdk==0.7.6",  # Jev na triagem (classifier = "jev")
    "anthropic==2.14.0",    # agente com LLM (AGENT_IMPL = "llm")
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helpdesk = ["platform/*.sql", "triage/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
